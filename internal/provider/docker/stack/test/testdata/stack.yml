name: introspect-integration

services:
  db:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./cfg:/etc/postgresql/conf.d
      - /var/lib/postgresql/scratch
      - type: tmpfs
        target: /run/postgresql
  web:
    image: nginx:1
    volumes:
      - assets:/usr/share/nginx/html
  api:
    image: alpine:3
    volumes:
      - assets:/srv/assets

volumes:
  pgdata:
  assets:
    name: shared_assets
  orphan:
