# Demo stack for gm-tools. Each store is backed by a different Docker volume
# type so a single `gm savepoint create` / `gm rollback` captures and restores
# all three:
#
#   postgres -> named volume     (pgdata)
#   minio    -> host bind mount   (./minio-data)
#   redis    -> anonymous volume  (/data)
#
# The project name is pinned so gm and the docker CLI agree on the container
# labels gm uses to locate each mount.
name: gm-demo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - pgdata:/var/lib/postgresql/data        # named volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # No host ports published; the app reaches MinIO over the compose network.
    # Uncomment to use the web console at http://localhost:9001
    # ports:
    #   - "9001:9001"
    volumes:
      - ./minio-data:/data                     # host bind mount
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 3s
      timeout: 6s
      retries: 10

  redis:
    image: redis:7
    # appendonly keeps the anonymous /data volume populated so rollback restores it.
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - /data                                  # anonymous volume
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: ./app
    ports:
      - "8080:8080"
    environment:
      PG_DSN: "postgres://postgres:demo@postgres:5432/demo?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "demo"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
