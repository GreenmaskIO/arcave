
services:
  playground-storage:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - "MINIO_ROOT_USER=Q3AM3UQ867SPQQA43P2F"
      - "MINIO_ROOT_PASSWORD=zuf+tfteSlswRu7BJ86wekitnifILbZam1KYY3TG"
    entrypoint: sh
    command: >
      -c 'minio server /exports --console-address :9001'
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 2
    volumes:
      - miniodata:/export/adventureworks1
      - pgdata:/export/adventureworks2
      - ./test:/export/adventureworks3
      - /export/adventureworks4


  playground-db:
    volumes:
      - "playground_pgdata:/var/lib/postgresql/data"
    image: postgres:16
    ports:
      - "54316:5432"
    restart: always
    environment:
      POSTGRES_PASSWORD: example
    healthcheck:
      test: [ "CMD", "psql", "-U", "postgres" ]
      interval: 5s
      timeout: 1s
      retries: 3

  greenmask:
    image: greenmaskio/greenmask:latest
    environment:
      PGPASSWORD: example

volumes:
  pgdata:
  miniodata:
  playground_pgdata: