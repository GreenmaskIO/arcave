#   pull request  -> lint + unit + integration
#   push to main  -> lint + unit + integration + build every target (nothing published)
#   push of a tag -> lint + unit + integration + build every target + GitHub Release
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: make test-unit

  integration:
    name: Integration tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    # One runner per slow package: the job takes as long as the slowest of them,
    # not their sum.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test
            pkgs: ./test
          - name: cdcbackend
            pkgs: ./test/cdcbackend
          - name: resticrest, tarcopybackend
            pkgs: ./test/resticrest ./test/tarcopybackend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # test/resticrest skips its conformance test when no restic binary is on
      # PATH, so without this the suite would go green having never run it.
      - name: Install restic
        run: |
          sudo apt-get update
          sudo apt-get install -y restic

      # The integration suites create containers through raw creates that never
      # pull; pulling every image they name once here keeps the first test from
      # paying (or flaking on) the pull.
      - name: Pre-pull integration test images
        run: |
          docker pull busybox
          docker pull alpine:3.22
          docker pull restic/restic:0.19.1

      - name: Run integration tests
        run: make test-integration INTEGRATION_PKGS="${{ matrix.pkgs }}"

  build:
    name: Build (all targets)
    if: github.ref == 'refs/heads/main'
    needs: [lint, unit, integration]
    # macOS, not ubuntu: the darwin targets need cgo (compose/v2 pulls in the cgo-only fsnotify/fsevents)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A compile check, nothing more: the output stays on the runner and is
      # discarded with it. Nothing is uploaded and nothing is published — the
      # question this job answers is only "does every target still build".
      #
      # `release --snapshot --skip=publish` rather than plain `build`: it costs a
      # few extra seconds to also pack the archives and checksums, and in return
      # a mistake in that half of .goreleaser.yaml fails here instead of at the
      # moment someone pushes a release tag.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, unit, integration]
    # Same reason as the build job: the darwin targets need cgo, so the release
    # is cut on macOS.
    runs-on: macos-latest
    permissions:
      # Creating the release and uploading its assets is the one write this
      # workflow performs.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser reads the tag history to derive the version and build the
          # changelog; a shallow clone has neither.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
